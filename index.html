<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wakwito Laundry offers premium washing, dry cleaning, ironing, pickup, and delivery services in Nairobi." />
    <title>Wakwito Laundry</title>
    <script>
      (() => {
        const preference = localStorage.getItem('wakwito-theme') || 'system';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = preference === 'system'
          ? (systemDark ? 'dark' : 'light')
          : preference;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-preference', preference);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
